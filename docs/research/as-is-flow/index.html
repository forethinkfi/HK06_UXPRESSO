<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AS-IS 키오스크 플로우 (정면 재구성)</title><link rel="stylesheet" href="kiosk.css">
<style>body{background:#f4f4f6;padding:30px;color:#1e1e28}h1{font-size:30px}p.lead{color:#555;margin:6px 0 24px;max-width:900px}
.g{display:flex;flex-wrap:wrap;gap:34px}.it{width:307px}.it .box{width:307px;height:410px;border:5px solid #1b1b1b;border-radius:14px;overflow:hidden;position:relative;background:#fff}.it .box .scr{transform:scale(.3984);transform-origin:0 0}
.it h3{margin-top:10px;font-size:16px}.it h3 span{display:inline-block;background:#1e1e28;color:#fff;border-radius:50%;width:26px;height:26px;text-align:center;line-height:26px;margin-right:6px;font-size:13px}.it small{display:block;color:#666;font-size:13px;line-height:1.4}</style></head><body>
<h1>AS-IS 키오스크 주문 플로우 — 정면 재구성</h1><p class="lead">실제 매장 영상(약 3분 50초)에서 확인한 화면을 정면 기준 768×1024로 다시 그린 것입니다. 색상·크기는 영상에서 눈으로 읽은 근사값이고, 상품 이미지는 일러스트로 대체했습니다. 개인정보(휴대폰번호 등)는 옮기지 않았습니다. 시간은 영상 내 시각입니다.</p><div class="g" id="g"></div>
<script src="screens.js"></script><script>document.getElementById('g').innerHTML=SCREENS.map((s,i)=>`<div class="it"><div class="box"><div class="scr">${s.html}</div></div><h3><span>${i+1}</span>${s.t}</h3><small>영상 ${s.at}${s.note?' · '+s.note:''}</small></div>`).join('')</script></body></html>
