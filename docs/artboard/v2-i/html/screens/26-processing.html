body{margin:0}
.stage{width:1080px;height:1920px;position:relative;overflow:hidden;background:#fff;color:#231F20;font-family:Pretendard,'Noto Sans KR',system-ui,sans-serif;font-variant-numeric:tabular-nums}

.dsp{font-family:Pretendard,'Noto Sans KR',sans-serif;font-weight:700;letter-spacing:-.01em}
.ttl{font-family:'Black Han Sans','Noto Sans KR',sans-serif;font-weight:400}
.scr{position:absolute;left:0;top:0;width:1080px;height:1920px;overflow:hidden;background:#fff;animation:fadeIn 520ms ease both}
.b{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0;margin:0;white-space:nowrap;display:flex;align-items:center;justify-content:center;gap:12px;text-align:center;transition:transform 160ms ease}
.b:active{transform:scale(.96)}

.pill-y{background:#F8DA29;color:#231F20;border-radius:999px;height:112px;font-size:32px;font-weight:700;padding:0 40px}

.pill-y[disabled],.pill-k[disabled]{background:#E5E5E5;color:#757575;cursor:default}
.pill-o{background:rgba(35,31,32,.07);color:inherit;border-radius:999px;height:88px;font-size:28px;font-weight:600;padding:0 32px}
.ic{width:80px;height:80px;border-radius:999px;background:rgba(35,31,32,.08);color:#231F20}
.ic[disabled]{opacity:.35;cursor:default}
.cap{font-size:22px;line-height:32px;color:#5C5859}

.lbl-o{font-size:20px;font-weight:700;border-radius:999px;padding:2px 14px;background:rgba(35,31,32,.08);color:#5C5859}

@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes ringOut{0%{transform:scale(.8);opacity:.7}100%{transform:scale(1.5);opacity:0}}
@keyframes rise{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:none}}

@keyframes fade{0%{opacity:0}30%{opacity:1}70%{opacity:1}100%{opacity:0}}

@keyframes bump{0%{transform:scale(1)}35%{transform:scale(1.25) rotate(-6deg)}100%{transform:scale(1)}}

@keyframes lineIn{from{opacity:0;transform:translateX(-30px)}to{opacity:1;transform:none}}
@keyframes liqrise{from{transform:translateY(150px)}to{transform:translateY(22px)}}
@keyframes wavemove{to{transform:translateX(-120px)}}
@keyframes flow{to{stroke-dashoffset:-36}}
@keyframes numPop{0%{transform:scale(.4);opacity:0}60%{transform:scale(1.08);opacity:1}100%{transform:scale(1)}}
@keyframes checkPop{0%{transform:scale(0)}60%{transform:scale(1.15)}100%{transform:scale(1)}}

@keyframes shrink{from{transform:scaleX(1)}to{transform:scaleX(0)}}
@keyframes sheetUp{from{opacity:0;transform:translateY(60px)}to{opacity:1;transform:none}}
@keyframes print{0%{transform:translateY(-105%)}100%{transform:translateY(0)}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes jelly{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}

.sub.on{background:#231F20;color:#F8DA29;font-weight:700}

.seg{flex:1;height:10px;border-radius:5px;background:rgba(35,31,32,.18)}
.seg.on{background:#231F20}
.stk{position:relative;height:150px;border-radius:32px;flex-direction:column;gap:8px;background:#fff;box-shadow:inset 0 0 0 1px #E2E0D8;padding:0 8px;transition:background 200ms}
.stk:active{background:#F7F5EC}
.zig{height:22px;background:radial-gradient(circle at 12px 22px,transparent 12px,#fff 12.5px) 0 0/24px 22px repeat-x}
.perf{border-top:4px dashed #231F20;opacity:.2;margin:20px 0}
.liqrise{animation:liqrise 3s cubic-bezier(.4,0,.2,1) both}
.wavep{animation:wavemove 1.2s linear infinite}
