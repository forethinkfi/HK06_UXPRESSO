<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>UXPRESSO 시안 보드</title>
<style>
:root{--y:#FFD400;--ink:#33190A;--bg:#FAF8F2;--mute:#5B4A3F;--or:#FF9F1A}
*{box-sizing:border-box;margin:0}
body{font-family:-apple-system,"Apple SD Gothic Neo","Pretendard","Noto Sans KR",sans-serif;background:var(--bg);color:var(--ink);line-height:1.5}
header{background:var(--y);padding:36px 5vw 28px}
header h1{font-size:34px;font-weight:900}header p{margin-top:6px;font-size:18px;font-weight:600}
header a{display:inline-block;margin-top:16px;background:var(--ink);color:#fff;padding:12px 22px;border-radius:30px;font-weight:800;text-decoration:none}
main{padding:12px 5vw 60px}
h2{font-size:24px;margin:40px 0 16px;border-bottom:3px solid var(--ink);padding-bottom:6px}
.row{display:flex;flex-wrap:wrap;gap:28px}
figure{width:300px}
.frame{display:block;position:relative;width:300px;height:533px;border:6px solid #1b1b1b;border-radius:18px;overflow:hidden;background:#fff}
.frame iframe{position:absolute;left:0;top:0;width:1080px;height:1920px;border:0;transform:scale(.2778);transform-origin:0 0;pointer-events:none}
.frame:focus-visible{outline:4px solid #0b57d0;outline-offset:3px}
figcaption{margin-top:10px;font-size:16px}figcaption b{display:block;font-size:18px}figcaption span{color:var(--mute)}
footer{padding:0 5vw 40px;color:var(--mute);font-size:14px}
</style></head><body>
<header><h1>UXPRESSO 개선 키오스크 시안 보드</h1><p>1080 × 1920 · 핵심 화면 모음. 화면을 누르면 해당 상태의 프로토타입이 열려요.</p><a href="/">프로토타입 처음부터 해 보기</a></header>
